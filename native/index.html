<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="theme-color" content="#f2f2f7" />
    <title>ميزان</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, "Noto Sans Arabic", sans-serif; }
      html, body { margin: 0; min-height: 100%; background: #f2f2f7; }
      #boot { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #1c1c1e; }
      .boot-card { width: min(100%, 340px); text-align: center; }
      .boot-mark { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 22px; background: #0091ff; display: grid; place-items: center; color: white; font-size: 34px; font-weight: 800; box-shadow: 0 12px 30px #0091ff33; }
      .boot-spinner { width: 28px; height: 28px; margin: 0 auto 14px; border: 3px solid #d1d1d6; border-top-color: #0091ff; border-radius: 50%; animation: spin .8s linear infinite; }
      .boot-title { margin: 0; font-size: 20px; font-weight: 750; }
      .boot-message { margin: 8px 0 0; color: #636366; font-size: 14px; }
      .boot-error { display: none; margin-top: 18px; padding: 12px 14px; border-radius: 14px; background: #fff; color: #8e1b1b; font-size: 13px; line-height: 1.6; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-mark" aria-hidden="true">م</div>
          <div class="boot-spinner" aria-hidden="true"></div>
          <p class="boot-title">جارٍ تشغيل ميزان</p>
          <p class="boot-message">لحظات ونجهّز دفترَك</p>
          <p id="boot-error" class="boot-error">تعذر تشغيل التطبيق. أغلقه وافتحه مرة أخرى.</p>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function () {
        var error = document.getElementById('boot-error');
        if (error) error.style.display = 'block';
      }, true);
      window.addEventListener('unhandledrejection', function () {
        var error = document.getElementById('boot-error');
        if (error) error.style.display = 'block';
      });
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
