[package]
name = "z-ai-desktop"
version = "1.0.0"
description = "Z-Ai desktop shell (Tauri 2) wrapping the /zai web app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "z_ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
