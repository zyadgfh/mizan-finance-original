name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: write
  statuses: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript, lint, and tests
        run: npm run typecheck && npm run lint && npm test

      - name: Build native bundle and sync Capacitor Android
        run: npm run cap:sync

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mizan-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mizan-debug-apk
          path: mizan-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK blob checksum status for sandbox retrieval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_SHA256="$(sha256sum mizan-debug.apk | awk '{print $1}')"
          BLOB_SHA="$(node -e '
            const fs = require("fs");
            const payload = JSON.stringify({
              content: fs.readFileSync("mizan-debug.apk").toString("base64"),
              encoding: "base64"
            });
            fs.writeFileSync("/tmp/blob.json", payload);
          ' && gh api "repos/${{ github.repository }}/git/blobs" --method POST --input /tmp/blob.json --jq '.sha')"
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="success" \
            -f context="mizan/android-apk" \
            -f description="blob:${BLOB_SHA}:${APK_SHA256:0:16}"
          rm -f /tmp/blob.json
